name: CI/CD Hackemon

on:
  push:
    branches: [ "main", "feat/docker", "feat/CI-CD", "dev" ]
  pull_request:
    branches: [ "main", "feat/docker", "feat/CI-CD", "dev" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

  build-remote:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    steps:
      - name: Mise à jour et build sur le serveur
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo chown -R svc_hackemon:svc_hackemon /srv/hackemon
            sudo -u svc_hackemon bash -c "
              cd /srv/hackemon &&
              if [ ! -d .git ]; then
                git init .
                git remote add origin https://github.com/${{ github.repository }}.git
              fi
              git config --global --add safe.directory /srv/hackemon &&
              git fetch origin ${{ github.ref_name }} &&
              git reset --hard origin/${{ github.ref_name }} &&
              docker compose build site jeu
            "

  deploy:
    needs: build-remote
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    steps:
      - name: Lancement des conteneurs via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo chown -R svc_hackemon:svc_hackemon /srv/hackemon
            sudo -u svc_hackemon bash -c "
              cd /srv/hackemon &&
              docker compose down &&
              docker compose up -d
            "
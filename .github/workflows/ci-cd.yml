name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "feat/docker", "feat/CI-CD", "dev" ]
  pull_request:
    branches: [ "main", "feat/docker", "feat/CI-CD", "dev" ]

jobs:
  # 1. Job de Continuous Integration (Vérification du code Node.js)
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Je l'ai passé à 20 pour correspondre à tes Dockerfiles (node:20)
          cache: 'npm'
          
      - name: Installation des dépendances
        run: npm ci

  # 2. Job de Test Docker (Vérifie que les conteneurs buildent bien sans les pousser)
  # Ce job s'exécutera uniquement si le job "ci" réussit
  test-docker:
    needs: ci
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
          
      # conteneur de site
      - name: Test du Build Docker (Site)
        uses: docker/build-push-action@v5
        with:
          context: . 
          file: ./dockerfile.site # On utilise le vrai nom que tu m'as donné
          push: false # push à "false" : on teste juste que ça valide le build
          tags: hackemon-site:test

      # conteneur de jeu
      - name: Test du Build Docker (Jeu)
        uses: docker/build-push-action@v5
        with:
          context: . 
          file: ./dockerfile.jeu # On utilise le vrai nom que tu m'as donné
          push: false # push à "false" : on teste juste que ça valide le build
          tags: hackemon-jeu:test

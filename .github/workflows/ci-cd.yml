name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "feat/docker", "feat/CI-CD", "dev" ]
  pull_request:
    branches: [ "main", "feat/docker", "feat/CI-CD", "dev" ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Installation des dépendances
        run: npm ci

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        
      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      # conteneur de site
      - name: Build et Push de l'image Docker (Site)
        uses: docker/build-push-action@v5
        with:
          context: . 
          file: ./dockerfile.site
          push: true
          tags: ghcr.io/${{ github.repository }}/hackemon-site:latest

      # conteneur de jeu
      - name: Build et Push de l'image Docker (Jeu)
        uses: docker/build-push-action@v5
        with:
          context: . 
          file: ./dockerfile.jeu
          push: true
          tags: ghcr.io/${{ github.repository }}/hackemon-jeu:latest

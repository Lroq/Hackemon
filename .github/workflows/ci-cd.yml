name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "feat/docker", "feat/CI-CD", "dev" ]
  pull_request:
    branches: [ "main", "feat/docker", "feat/CI-CD", "dev" ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Installation des dépendances
        run: npm ci

  test-docker:
    needs: ci
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
          
      # conteneur de site
      - name: Test du Build Docker (Site)
        uses: docker/build-push-action@v5
        with:
          context: . 
          file: ./dockerfile.site
          push: false # push à "false" : on teste juste que ça valide le build
          tags: hackemon-site:test

      # conteneur de jeu
      - name: Test du Build Docker (Jeu)
        uses: docker/build-push-action@v5
        with:
          context: . 
          file: ./dockerfile.jeu
          push: false # push à "false" : on teste juste que ça valide le build
          tags: hackemon-jeu:test

  build:
    needs: test-docker
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        
      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      # conteneur de site
      - name: Build et Push de l'image Docker (Site)
        uses: docker/build-push-action@v5
        with:
          context: . 
          file: ./dockerfile.site
          push: true
          tags: ghcr.io/${{ github.repository }}/hackemon-site:latest

      # conteneur de jeu
      - name: Build et Push de l'image Docker (Jeu)
        uses: docker/build-push-action@v5
        with:
          context: . 
          file: ./dockerfile.jeu
          push: true
          tags: ghcr.io/${{ github.repository }}/hackemon-jeu:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      # Étape de déploiement (généralement on se connecte en SSH au serveur pour pull et relancer docker-compose)
      - name: Déploiement sur le serveur
        run: |
          echo "Ici viendra la commande pour déployer sur le serveur !"
          echo "Exemple :"
          echo "ssh user@vps 'docker pull ghcr.io/${{ github.repository }}/hackemon-site:latest && docker-compose up -d'"
